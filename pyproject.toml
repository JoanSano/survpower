[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "survpower"
version = "0.2.1"
description = "Power and sample-size planning for continuous biomarkers under the Cox model, with hazard-ratio and concordance-index effect sizes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "survpower contributors" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "lifelines>=0.27",
    "matplotlib>=3.5",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9", "mkdocstrings[python]>=0.24"]

[project.scripts]
survpower = "survpower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer Monte Carlo checks (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning"]
