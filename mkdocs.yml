site_name: survpower
site_description: Power and sample-size planning for continuous biomarkers under the Cox model
# each branch build sets DOCS_SITE_URL to its own folder (scripts/build_docs_site.sh)
site_url: !ENV [DOCS_SITE_URL, "https://joansano.github.io/survpower/"]
repo_url: https://github.com/JoanSano/survpower
repo_name: JoanSano/survpower

# issue drafts and the roadmap are not published
exclude_docs: |
  dev/
  tutorials/README.md

# figures are drawn at build time from the package, not committed
hooks:
  - scripts/docs_figures.py

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/brightness-4, name: Light mode }

nav:
  - Home: index.md
  - Quickstart (grant & trial recipes): quickstart.md
  - Command-line reference: cli.md
  - Concepts:
      - concepts/index.md
      - Effect sizes (HR and concordance): concepts/effect-sizes.md
      - Censoring, accrual and attrition: concepts/censoring-and-accrual.md
      - Adjustment covariates: concepts/adjustment.md
      - Concordance questions: concepts/concordance.md
      - Non-proportional hazards: concepts/ph-violations.md
      - How the simulations work: concepts/methods.md
  - Tutorials:
      - Continuous vs. median split: tutorials/01_continuous_vs_dichotomized.py
      - Sample size for a target power: tutorials/02_sample_size_for_target_power.py
  - Python API: api.md
  - References: references.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.arithmatex: { generic: true }

extra:
  # branch selector in the header; reads ../versions.json written by
  # scripts/build_docs_site.sh (mike's format; mike itself is not used)
  version:
    provider: mike

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  # tutorials are Jupytext .py files, executed at build time (docs/tutorials/README.md)
  - mkdocs-jupyter:
      execute: true
      include_source: true
      include: ["tutorials/*.py"]
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            heading_level: 3
