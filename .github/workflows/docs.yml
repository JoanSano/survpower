# Build the MkDocs site of every branch (scripts/build_docs_site.sh) and publish
# it to GitHub Pages: main at /survpower/main/, each branch at /survpower/<branch>/,
# with a branch selector in the header.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
#
# The github-pages environment only accepts deployments from main, so a push to
# (or deletion of) any other branch just re-dispatches this workflow on main,
# which rebuilds all branches.
name: docs

on:
  push:
    branches: ["**"]
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: github.ref != 'refs/heads/main' || github.event_name == 'delete'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run docs.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: scripts/build_docs_site.sh site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
